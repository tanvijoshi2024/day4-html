<!DOCTYPE html>
<html>
    <head>
        <title>Flexbox Practice</title>
    </head>
    <body style="padding-bottom: 1000px;">
        <div style="display: flex;
        flex-direction: row; 
       ">
            <div style="background-color: aqua;">div1 text</div>
            <div style="background-color: palevioletred;">div2 <p>text</p></div>
        </div>



        <div style="display: flex;
        flex-direction: row;
         margin-top: 30px;
        ">
            <div style="background-color: aqua; width:100px">100px</div>
            <div style="flex:1;
            background-color: palevioletred;">flex1</div>
        </div>



      
        <div style="display: flex;
        flex-direction: row;
         margin-top: 30px;
        ">
            <div style="background-color: aqua; width:100px">100px</div>
            <div style="flex:1;
            background-color: palevioletred;">flex1</div>
            <div style="background-color: aqua; flex:2">flex20</div>
        </div>
        
      
        
        <div style="display: flex;
        flex-direction: row;
         margin-top: 30px;
         height:70px;
         border-width:1px;
         border-style:solid;
         border-color:gray;
         justify-content: center;
         
        ">
            <div style="background-color: aqua; width:100px">100px</div>
            <div style="width:100px;
            background-color: palevioletred;">flex1</div>
            <div style="background-color: aqua; width:100px;">flex20</div>
        </div>





        <div style="display: flex;
        flex-direction: row;
         margin-top: 30px;
         height:70px;
         border-width:1px;
         border-style:solid;
         border-color:gray;
         justify-content: space-between;
         
        ">
            <div style="background-color: aqua; width:100px">100px</div>
            <div style="width:100px;
            background-color: palevioletred;">flex1</div>
            <div style="background-color: aqua; width:100px;">flex20</div>
        </div>





         <div style="display: flex;
        flex-direction: row;
         margin-top: 30px;
         height:70px;
         border-width:1px;
         border-style:solid;
         border-color:gray;
         justify-content: space-between;
         align-items: center;
         
        ">
            <div style="background-color: aqua; width:100px">100px</div>
            <div style="width:100px;
            background-color: palevioletred;">flex1</div>
            <div style="background-color: aqua; width:100px;">flex20</div>
        </div>
    </body>
</html>
