<!DOCTYPE html>
<html>
    <head>
        <style>
            .dic{
                text-align:center;
                
            }
            .img{
                width: 300px;
                height: 100px;
                margin-bottom: 0;
                
            }
            .url{
                width: 300px;
                height: 30px;
                border-radius: 100px;
                text-align: center;
                display:block;
                margin-top: 0;

            }
            .btn,.btm{
                width: 150px;
                height: 30px;
                border:none;
                background-color: whitesmoke;
                font-weight:bold;
                margin-top:30px;
                margin-left: 10px;
            }
        </style>

    </head>
    <body>
        <div class="dic"></div>
         <img class="img" src="unnamed.webp" >
         <input class="url" type="text" placeholder="Search Google or type a URL">
         <button class="btn">Google Search</button>
         <button class="btm">I'm Feeling Lucky</button>
    </body>
</html>
