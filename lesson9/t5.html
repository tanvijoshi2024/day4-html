<!DOCTYPE html>
<html>
    <head>
        <style>
            .hq{
                width: 90px;
                height: 90px;
                border-radius: 50%;
                display:inline-block;
               
            }
            .hp{
                width: 500px;
                height: 100px;
                border-radius: 10px;
                border:none;
                font-size:50px;
                display: inline-block;
                

            }
            .tweet{
                background-color: blue;
                color:white;
                border-radius: 20px;
                border:none;
                font-size:20px;
                display:inline-block;
                height : 40px;
                width : 80px;
                margin-left: 10%;
                
            }
            .box{
                width: 800px;
                height: 100px;
                background-color:whitesmoke;
                border-radius: 8px;
                display:flex;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <div class="box">

         <img  class="hq" src="image.avif">
         <p class="hp">What's happening?</p>
         <button class="tweet">Tweet</button>
    </body>
</html
